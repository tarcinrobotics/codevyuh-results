<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Codevyuh</title>
  <meta name="description" content="Administrative sign-in for Codevyuh Competition and Assessment Platform." />
  <script>
    (() => {
      const stored = localStorage.getItem('dashboard-theme');
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg: #080b11;
      --card-bg: #0e131f;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --input-bg: #080b12;
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --btn-primary: #2563eb;
      --btn-primary-hover: #1d4ed8;
      --btn-text: #ffffff;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --input-focus: #2563eb;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --btn-primary: #2563eb;
      --btn-primary-hover: #1d4ed8;
      --btn-text: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.06), transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .theme-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    /* ── Main Container ─────────────────────────────────────────── */
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ── Form Controls ──────────────────────────────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .input::placeholder {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .pwd-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .pwd-toggle:hover {
      color: var(--text-primary);
    }

    /* ── Error Banner ───────────────────────────────────────────── */
    .error-box {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      font-size: 0.82rem;
      line-height: 1.4;
      align-items: center;
      gap: 8px;
    }

    /* ── Submit Button ──────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 11px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--btn-primary);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: background-color 0.15s ease, transform 0.1s ease;
      margin-top: 6px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--btn-primary-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header" role="banner">
    <a href="/login" class="brand-link">
      <div class="brand-icon" aria-hidden="true">
        <i data-lucide="award" style="width:18px;height:18px"></i>
      </div>
      <span class="brand-name">Codevyuh</span>
    </a>

    <button class="theme-btn" type="button" data-theme-toggle aria-label="Toggle theme">
      <svg data-theme-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"></svg>
    </button>
  </header>

  <!-- Login Card -->
  <main class="main-wrap" role="main">
    <div class="card">
      <h1 class="card-title">Sign in</h1>
      <p class="card-desc">Enter your administrative credentials to access your competition dashboard.</p>

      <form id="login-form" class="form" autocomplete="on" novalidate>
        <!-- Username -->
        <div class="field">
          <label class="label" for="username">Email or username</label>
          <div class="input-wrap">
            <input
              id="username"
              name="username"
              class="input"
              type="text"
              placeholder="name@organization.com"
              autocomplete="username"
              required
              aria-required="true"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button type="button" class="pwd-toggle" id="btn-toggle-pwd" aria-label="Show password">
              <i data-lucide="eye" style="width:16px;height:16px"></i>
            </button>
          </div>
        </div>

        <!-- Error Banner -->
        <div class="error-box" id="error-box" role="alert" aria-live="polite">
          <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0"></i>
          <span id="error-text"></span>
        </div>

        <!-- Submit Button -->
        <button id="btn-submit" class="btn-submit" type="submit">
          <span id="submit-label">Sign in</span>
          <i data-lucide="arrow-right" style="width:16px;height:16px"></i>
        </button>
      </form>
    </div>
  </main>

  <!-- Clean Enterprise Footer -->
  <footer class="footer">
    <div>&copy; 2026 Codevyuh Assessment Platform. All rights reserved.</div>
    <div>Secure Administrative Gateway</div>
  </footer>

  <script src="/js/theme.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();

    const form = document.getElementById('login-form');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('btn-submit');
    const submitLabel = document.getElementById('submit-label');
    const pwdToggle = document.getElementById('btn-toggle-pwd');

    // Password Show/Hide Toggle
    if (pwdToggle && passInput) {
      pwdToggle.addEventListener('click', () => {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        pwdToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        pwdToggle.innerHTML = isPassword
          ? '<i data-lucide="eye-off" style="width:16px;height:16px"></i>'
          : '<i data-lucide="eye" style="width:16px;height:16px"></i>';
        if (window.lucide) lucide.createIcons();
      });
    }

    function showError(msg) {
      if (errorBox && errorText) {
        errorText.textContent = msg;
        errorBox.style.display = 'flex';
        if (window.lucide) lucide.createIcons();
      }
    }

    function hideError() {
      if (errorBox) {
        errorBox.style.display = 'none';
      }
    }

    // Submit handler with automatic routing
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const username = userInput.value.trim();
      const password = passInput.value;

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitLabel.textContent;
      submitLabel.textContent = 'Authenticating…';

      try {
        const payload = { username, password };
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed. Please verify credentials.');
        }

        window.location.href = data.redirectTo || '/admin-overview';
      } catch (err) {
        showError(err.message || 'Login service unavailable. Please retry.');
      } finally {
        submitBtn.disabled = false;
        submitLabel.textContent = originalText;
      }
    });
  </script>
</body>
</html>
