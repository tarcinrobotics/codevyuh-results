version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: codevyuh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-codevyuh_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-codevyuh_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codevyuh-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-codevyuh_db}
      PGSSLMODE: disable
      SESSION_SECRET: ${SESSION_SECRET:-codevyuh-production-secret-replace-me}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-SuperAdmin@123}
      DOLPHIN_ADMIN_PASSWORD: ${DOLPHIN_ADMIN_PASSWORD:-dolphinprelims@2026}
      KLN_ADMIN_PASSWORD: ${KLN_ADMIN_PASSWORD:-klnprelims@2026}
      MONGO_URI: ${MONGO_URI:-}

volumes:
  pgdata:
    driver: local
